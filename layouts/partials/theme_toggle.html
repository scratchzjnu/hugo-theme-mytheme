{{/* 日/夜间切换按钮：日间显示月亮（点击切到夜间），夜间显示太阳（点击切到日间）。
     图标用内联 SVG，跟随 currentColor，不依赖 emoji 字体。
     调用方式：{{ partial "theme_toggle.html" (dict "Class" "d-none d-lg-block") }} */}}
<button data-theme-toggle type="button" class="btn theme-toggle-btn {{ .Class }}"
        aria-label="切换至夜间模式" title="切换至夜间模式">
  <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>
  <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="5" />
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
  </svg>
</button>
